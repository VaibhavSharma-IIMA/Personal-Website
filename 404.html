<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'" />
  <title>404 · Vaibhav Sharma</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
  <!-- Self-contained on purpose: GitHub Pages serves this file at any missing path, so it cannot rely on relative assets. -->
  <style>
    :root { --bg: #06080d; --text: #e6ecf5; --muted: #8a97ad; --accent: #38e1ff; --border: rgba(120,150,200,0.2); }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f5f7fb; --text: #101a2e; --muted: #47536b; --accent: #0c7597; --border: rgba(40,60,100,0.2); }
    }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text);
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; line-height: 1.6; }
    main { max-width: 520px; }
    .k { color: var(--accent); font-size: 0.85rem; letter-spacing: 1px; }
    h1 { font-size: clamp(2rem, 8vw, 3.2rem); margin: 8px 0 12px; }
    p { color: var(--muted); margin-bottom: 22px; }
    a { display: inline-block; color: var(--accent); text-decoration: none; border: 1px solid var(--border); border-radius: 999px; padding: 9px 18px; }
    a:hover, a:focus-visible { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="k">ERROR 404 · no records returned</div>
    <h1>Page not found</h1>
    <p>That address does not match anything on this site. The whole story lives on one page.</p>
    <!-- The site is a GitHub Pages project site, so home is /Personal-Website/, not /. Change this if the site moves to a custom domain. -->
    <a href="/Personal-Website/">Back to the site →</a>
  </main>
</body>
</html>
